<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#63a2f2">
    <title>DOLVO — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --brand:#63a2f2; --brand-2:#85b5f3; --text:#121212; --muted:#4a4a4a; --card:#ffffff; --shadow:rgba(12,47,96,0.12); }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: Montserrat, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
            color: var(--text);
            background: radial-gradient(1200px 800px at 85% 10%, #e6f0fe 0%, #f7fbff 50%, #ffffff 100%);
            min-height: 100dvh;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
        }
        .bg-blob { position:absolute; filter: blur(140px); opacity:.6; pointer-events:none; }
        .bg-blob.b1 { width: 520px; height: 520px; background: #63a2f2; top: -120px; right: -120px; border-radius: 50%; }
        .bg-blob.b2 { width: 640px; height: 640px; background: #85b5f3; bottom: -200px; left: -200px; border-radius: 50%; opacity:.45; }
        .card {
            background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0.92));
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 36px;
            width: min(760px, 92vw);
            box-shadow: 0 24px 80px var(--shadow);
            text-align: center;
            border: 1px solid rgba(99,162,242,0.18);
        }
        .logo { display:inline-flex; align-items:center; justify-content:center; margin-bottom: 24px; }
        .logo img { height: 50px; width:auto; display:block; }
        .badge { display:inline-block; background: var(--brand); color:#fff; border-radius: 999px; padding: 9px 14px; font-weight: 700; letter-spacing: .3px; font-size: 12px; box-shadow: 0 6px 18px rgba(99,162,242,.35); }
        h1 { margin: 12px 0 12px; font-size: clamp(32px, 4.2vw, 44px); line-height: 1.15; font-weight: 700; }
        h1 .accent { color: var(--brand); }
        .tagline { margin: 0 auto 28px; font-size: clamp(16px, 2.1vw, 20px); color: var(--muted); max-width: 46ch; }
        .cta {
            display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top: 8px;
        }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:12px 18px; border-radius:12px; font-weight:700; text-decoration:none; border:1px solid transparent; transition:.2s ease; }
        .btn.primary { background: var(--brand); color:#fff; box-shadow: 0 10px 24px rgba(99,162,242,.35); }
        .btn.primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .btn.outline { background: #fff; color: var(--brand); border-color: rgba(99,162,242,.4); }
        .btn.outline:hover { background: #f3f8ff; }
        .contacts { margin-top: 28px; display: grid; gap: 10px; justify-items:center; color:#1c1c1c; }
        .contacts .row { display:flex; gap:10px; align-items:center; }
        .contacts a { color: var(--brand); text-decoration:none; font-weight:600; }
        .contacts a:hover { text-decoration: underline; }
        footer { margin-top: 22px; font-size: 12px; color: #6b7280; }
        @media (max-width: 480px) {
            .logo img { height: 42px; }
            .card { padding: 36px 22px; }
        }
    </style>
    <meta name="robots" content="noindex, nofollow">
</head>
<body>
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>
    <main class="card" role="main">
        <div class="logo">
            <img src="images/logo-dolvo.svg" alt="DOLVO logo">
        </div>
        <span class="badge">Coming soon</span>
        <h1>We’re getting things <span class="accent">ready</span></h1>
        <p class="tagline">From quick fixes to full makeovers — we’ll launch soon. Stay in touch for updates and early access.</p>

        <div class="cta" role="group" aria-label="Contact actions">
            <a class="btn primary" href="tel:+0005550000">Call us: +000 555-00-00</a>
            <a class="btn outline" href="mailto:email@email.com">Email: email@email.com</a>
        </div>

        <div class="contacts" aria-label="Contacts">
            <div class="row">Location: <strong>Dublin</strong></div>
            <div class="row">Phone: <a href="tel:+0005550000">+000 555-00-00</a></div>
            <div class="row">Email: <a href="mailto:email@email.com">email@email.com</a></div>
        </div>
        <footer>© 2025 DOLVO</footer>
    </main>
</body>
</html>
